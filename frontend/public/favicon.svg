<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background: Deep navy like GoI portal -->
  <rect width="100" height="100" rx="18" fill="#0a1628"/>
  
  <!-- Ashoka Stambha (Lion Capital of Ashoka) - Stylised SVG -->
  <!-- Base Abacus Platform -->
  <rect x="18" y="80" width="64" height="7" rx="3" fill="#F59E0B"/>
  
  <!-- Pillar / Column Shaft -->
  <rect x="44" y="42" width="12" height="38" rx="2" fill="#D97706"/>
  
  <!-- Chakra Ring above pillar -->
  <circle cx="50" cy="38" r="10" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <!-- Chakra spokes (24 spokes of Ashoka Chakra) -->
  <g stroke="#F59E0B" stroke-width="1">
    <line x1="50" y1="29" x2="50" y2="47"/>
    <line x1="41.3" y1="31.8" x2="58.7" y2="44.2"/>
    <line x1="40" y1="38" x2="60" y2="38"/>
    <line x1="41.3" y1="44.2" x2="58.7" y2="31.8"/>
    <line x1="50" y1="47" x2="50" y2="29"/>
    <line x1="58.7" y1="44.2" x2="41.3" y2="31.8"/>
    <line x1="60" y1="38" x2="40" y2="38"/>
    <line x1="58.7" y1="31.8" x2="41.3" y2="44.2"/>
    <!-- Diagonal spokes -->
    <line x1="43.5" y1="30.5" x2="56.5" y2="45.5"/>
    <line x1="56.5" y1="30.5" x2="43.5" y2="45.5"/>
    <line x1="45.5" y1="29.5" x2="54.5" y2="46.5"/>
    <line x1="54.5" y1="29.5" x2="45.5" y2="46.5"/>
  </g>
  
  <!-- Four Lions (simplified) - two visible facing front -->
  <!-- Left Lion body -->
  <ellipse cx="37" cy="26" rx="8" ry="5" fill="#F59E0B"/>
  <circle cx="33" cy="21" r="5" fill="#F59E0B"/>
  <!-- Lion mane left -->
  <circle cx="30" cy="21" r="4" fill="#D97706" opacity="0.7"/>
  <!-- Left lion head detail -->
  <circle cx="33" cy="21" r="3" fill="#F59E0B"/>
  <!-- Left lion ear -->
  <polygon points="30,17 33,15 34,18" fill="#D97706"/>
  <!-- Left lion snout -->
  <ellipse cx="36" cy="22" rx="2" ry="1.5" fill="#D97706"/>
  
  <!-- Right Lion body -->
  <ellipse cx="63" cy="26" rx="8" ry="5" fill="#F59E0B"/>
  <circle cx="67" cy="21" r="5" fill="#F59E0B"/>
  <!-- Lion mane right -->
  <circle cx="70" cy="21" r="4" fill="#D97706" opacity="0.7"/>
  <!-- Right lion head detail -->
  <circle cx="67" cy="21" r="3" fill="#F59E0B"/>
  <!-- Right lion ear -->
  <polygon points="70,17 67,15 66,18" fill="#D97706"/>
  <!-- Right lion snout -->
  <ellipse cx="64" cy="22" rx="2" ry="1.5" fill="#D97706"/>
  
  <!-- Abacus decorative wheel pattern -->
  <circle cx="35" cy="83.5" r="3" fill="none" stroke="#B45309" stroke-width="1"/>
  <circle cx="50" cy="83.5" r="3" fill="none" stroke="#B45309" stroke-width="1"/>
  <circle cx="65" cy="83.5" r="3" fill="none" stroke="#B45309" stroke-width="1"/>
  
  <!-- Tricolor stripe at bottom -->
  <rect x="0" y="93" width="100" height="3.5" rx="0" fill="#FF9933"/>
  <rect x="0" y="96.5" width="100" height="3.5" rx="0" fill="#138808"/>
</svg>
